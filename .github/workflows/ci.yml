name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # `dxf` is an optional runtime extra, but the test suite imports ezdxf
        # (tests/test_dxf_export.py, tests/test_wires.py). Without it, pytest
        # aborts at collection and no test runs at all.
        run: python -m pip install -e '.[test,dxf]'
      - name: Test
        run: python -m pytest tests/ -q
